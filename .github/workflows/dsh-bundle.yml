name: dsh-bundle

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'skills/**'
      - 'CLAUDE.md'
      - '.markdownlint.json'
      - 'lib/**'
      - '.dsh/**'
      - 'cordis.patch.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'README.md'
      - 'README.en-US.md'
      - '.github/workflows/dsh-bundle.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'skills/**'
      - 'tests/**'
      - 'CLAUDE.md'
      - '.markdownlint.json'
      - 'lib/**'
      - '.dsh/**'
      - 'cordis.patch.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'README.md'
      - 'README.en-US.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Engine regression fixtures
        run: node tests/engine/run.mjs && node tests/apply-smoke.mjs
      - name: Browser-half contract
        # The client bundle is hand-authored, so `tsc` never type-checks or emits
        # it: this is the only check on its module id, its cordis injects, and
        # the settings field the Plugins page switch writes.
        run: node tests/dsh-client-half.test.mjs
      - name: schemastery fallback guard
        # Runs the built artifact with `.volatile` stripped off the real prototype,
        # i.e. as a schemastery 3.18.2 host (dsh 0.1.5-rc.2 / 0.1.5-rc.3) evaluates
        # it. Without this the degradation branch would only run on a user's
        # machine — and an unconditional `.volatile()` throws during import there,
        # which takes the whole host's boot down.
        run: node tests/dsh-volatile-fallback.test.mjs
      - name: SessionStart hook payload
        # The hook resolves the engine path and JSON-escapes the payload in pure
        # bash; this is what catches a control character, a CRLF file, or a
        # milliseconds-vs-seconds timeout in hooks.json. Skips itself (exit 0)
        # when bash is not on PATH.
        run: node tests/claude-session-start-hook.test.mjs
      # The suites below ship in `npm run test:engine` but were never run here, so
      # exporter output, the data-model checks, and the byte-for-byte parity between
      # the TypeScript and Python engines were unexercised in CI.
      - name: Data-model, concurrency and exporter suites
        run: node tests/data-engine/run.mjs && node tests/concurrency/run.mjs && node tests/exporters/run.mjs
      - name: Python engine parity
        # Skips itself (exit 0) when no interpreter is on PATH.
        run: node tests/python/run.mjs
      - name: Committed build artifact is current
        run: git diff --exit-code -- lib

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint dsh docs
        run: npx --yes markdownlint-cli@0.42.0 --ignore "**/node_modules/**" .
